[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-id-card"
version = "0.1.0"
description = "AIC: a living, self-renewing identity chain for autonomous agents"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "rfc8785==0.1.4"]

[project.optional-dependencies]
test = ["hypothesis>=6.100"]
dev = ["ruff>=0.16"]

[project.scripts]
aic = "agent_id_card.cli:main"

[tool.setuptools.packages.find]
include = ["agent_id_card*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501"]
